# 创作复盘周报自动化（机器全自动，异常才人工）
#
#   1. 每周一北京时间 09:00 自动运行；也可手动触发
#   2. 配置了 ZHIHU_ACCESS_SECRET 时：官方 manifest 安装 zhihu-cli（大小+SHA-256 校验）
#      并用 Secret 登录抓取最新创作；未配置时自动降级用仓库内缓存数据出报告
#   3. 统计 → 图表 → 自包含 HTML 报告，有变化则提交临时分支并自动 PR 合并
#      （符合仓库 protect-main 规则，validate 通过后自动上线）
#   4. 运行失败 → 自动创建 Issue 附日志链接（异常才人工）
#
# 部署位置：网站仓库根目录 .github/workflows/report.yml
# 前置条件：Settings -> Secrets and variables -> Actions 添加
#   ZHIHU_ACCESS_SECRET = 知乎开放平台 Access Secret（可选，缺省时用缓存出报告）

name: zhihu-content-review-report

on:
  schedule:
    - cron: "0 1 * * 1"   # UTC 01:00 = 北京时间 09:00 周一
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install matplotlib

      - name: 安装 zhihu-cli（有 Secret 才抓取；否则用缓存出报告）
        id: install
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$ZHIHU_ACCESS_SECRET" ]; then
            echo "::warning::未配置 ZHIHU_ACCESS_SECRET，使用仓库内缓存数据生成报告"
            exit 0
          fi
          MANIFEST="$(curl -fsSL --max-time 30 https://developer-cdn.zhihu.com/zhihu-cli/releases/stable/manifest.json)"
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) PLATFORM="darwin-arm64" ;;
            x86_64) PLATFORM="darwin-amd64" ;;
            *) echo "不支持的架构：$ARCH"; exit 1 ;;
          esac
          URL="$(printf '%s' "$MANIFEST" | python3 -c "import json,sys; print(json.load(sys.stdin)['cli']['artifacts']['$PLATFORM']['url'])")"
          SHA="$(printf '%s' "$MANIFEST" | python3 -c "import json,sys; print(json.load(sys.stdin)['cli']['artifacts']['$PLATFORM']['sha256'])")"
          SIZE="$(printf '%s' "$MANIFEST" | python3 -c "import json,sys; print(json.load(sys.stdin)['cli']['artifacts']['$PLATFORM']['size'])")"
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/zhihu-cli.tar.gz" "$URL"
          ACTUAL_SIZE="$(wc -c < "$RUNNER_TEMP/zhihu-cli.tar.gz" | tr -d ' ')"
          [ "$ACTUAL_SIZE" = "$SIZE" ] || { echo "大小不匹配：$ACTUAL_SIZE != $SIZE"; exit 1; }
          ACTUAL_SHA="$(shasum -a 256 "$RUNNER_TEMP/zhihu-cli.tar.gz" | awk '{print $1}')"
          [ "$ACTUAL_SHA" = "$SHA" ] || { echo "SHA-256 不匹配"; exit 1; }
          tar -xOf "$RUNNER_TEMP/zhihu-cli.tar.gz" zhihu-cli > "$RUNNER_TEMP/zhihu-cli"
          chmod 755 "$RUNNER_TEMP/zhihu-cli"
          echo "CLI_PATH=$RUNNER_TEMP/zhihu-cli" >> "$GITHUB_ENV"
          printf '%s' "$ZHIHU_ACCESS_SECRET" | "$RUNNER_TEMP/zhihu-cli" auth set --secret-stdin

      - name: 运行报告流水线（抓取/缓存 → 统计 → 图表 → HTML）
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        working-directory: 04-content-review
        run: |
          if [ -n "$ZHIHU_ACCESS_SECRET" ]; then
            python3 src/fetch_contents.py --force --cli "$CLI_PATH"
          else
            python3 src/fetch_contents.py
          fi
          python3 src/analyze_contents.py
          python3 src/make_charts.py
          python3 src/build_html.py

      - name: 提交并自动 PR 合并（符合仓库 PR 规则）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-content-review/output 04-content-review/data
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
            exit 0
          fi
          BRANCH="zhihu-report/auto-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore(04): 自动更新创作复盘报告（$(date +%F)）"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore(04): 自动更新创作复盘报告（$(date +%F)）" \
            --body "由 zhihu-content-review-report 自动化生成。validate 通过后自动合并。" >/dev/null
          gh pr merge "$BRANCH" --merge --delete-branch 2>/dev/null \
            || gh pr merge "$BRANCH" --merge --auto --delete-branch 2>/dev/null \
            || { echo "::error::自动合并失败，PR 已创建待人工处理"; exit 1; }

      - name: 运行失败自动开 Issue（异常才人工）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="zhihu-report 周报生成失败（$(date +%Y-%m-%d)）"
          EXISTS="$(gh issue list --state open --search "zhihu-report 周报生成失败" --json number --jq 'length')"
          if [ "$EXISTS" = "0" ]; then
            gh issue create --title "$TITLE" \
              --body "本次创作复盘周报生成失败，请查看运行日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
